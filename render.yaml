services:
  - type: web
    name: shark-btc-smc-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: SHARK_BASE_URL
        value: https://api.sharkexchange.in
      - key: SHARK_PAIR
        value: BTCUSDT
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMC_POLL_SECONDS
        value: "10"
